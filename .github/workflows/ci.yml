name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '21 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: '3.11'
          - os: macos-14
            python: '3.14'
          - os: macos-15-intel
            python: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check public source tree
        run: python scripts/check_public_tree.py
      - name: Install and build from source
        run: ./setup-macos.sh
      - name: Test conversion and worker behavior
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Test drag-and-drop app with a fresh runtime
        if: matrix.python != '3.14'
        run: .venv/bin/python scripts/smoke_packaged.py
      - name: Verify app signature and legal resources
        run: |
          codesign --verify --strict --verbose=2 EreaderMaker.app
          test -s EreaderMaker.app/Contents/Resources/Legal/LICENSE
          test -s EreaderMaker.app/Contents/Resources/EreaderMaker.icns

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt
